# Empêche la mise en pause du projet Supabase (plan gratuit) en envoyant
# une petite requête à la base deux fois par semaine.
# L'URL et la clé publique (anon) sont lues dans le fichier .env du dépôt :
# aucun secret GitHub n'est nécessaire.
name: Supabase keepalive

on:
  schedule:
    - cron: '0 6 * * 1,4' # lundi et jeudi à 06:00 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Requête légère sur la table classes
        run: |
          set -a; . ./.env; set +a
          SUPABASE_URL="$VITE_SUPABASE_URL"
          SUPABASE_ANON_KEY="$VITE_SUPABASE_ANON_KEY"
          curl -fsS "$SUPABASE_URL/rest/v1/classes?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -o /dev/null -w "HTTP %{http_code}\n"
