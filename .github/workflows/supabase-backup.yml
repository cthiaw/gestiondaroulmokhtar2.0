# Sauvegarde quotidienne de la base Supabase (schéma + données).
# Le fichier est chiffré avant d'être stocké, car le dépôt est public.
# Secrets requis :
#   SUPABASE_DB_URL    chaîne "Session pooler" (Supabase > Connect), mot de passe inclus
#   BACKUP_PASSPHRASE  phrase secrète pour chiffrer/déchiffrer les sauvegardes
# Restaurer : gpg -d sauvegarde.sql.gz.gpg | gunzip | psql "<nouvelle base>"
name: Supabase backup

on:
  schedule:
    - cron: '0 2 * * *' # tous les jours à 02:00 UTC
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Exporter et chiffrer la base
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          file="sauvegarde-$(date -u +%Y-%m-%d).sql.gz.gpg"
          docker run --rm -e DB_URL="$SUPABASE_DB_URL" postgres:17 \
            sh -c 'pg_dump "$DB_URL" --no-owner --no-privileges --schema=public --schema=auth --schema=storage' \
            | gzip \
            | gpg --batch --yes --symmetric --cipher-algo AES256 \
                --passphrase "$BACKUP_PASSPHRASE" -o "$file"
          ls -lh "$file"
          echo "BACKUP_FILE=$file" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BACKUP_FILE }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 90
